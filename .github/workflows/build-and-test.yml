name: Cube Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same services as a local `make test` : compose.yml holds their ports and tuning
      - name: Start test services
        run: docker compose up -d --build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis, curl, pcntl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install framework dependencies
        run: composer install

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 --port=9901 -uroot -proot --silent; then
              exit 0
            fi
            echo "($i / 30) Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not start in time"
          exit 1

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 9902 -U postgres; then
              exit 0
            fi
            echo "($i / 30) Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL did not start in time"
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            echo "($i / 30) Waiting for Redis..."
            sleep 2
          done
          echo "Redis did not start in time"
          exit 1

      - name: Wait for the APCu server
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9903/ || true)
            if [ "$STATUS" != "502" ] && [ "$STATUS" != "000" ]; then
              echo "APCu server answers with status $STATUS"
              exit 0
            fi
            echo "($i / 30) Waiting for the APCu server... Current status: $STATUS"
            sleep 2
          done
          echo "APCu server did not start in time"
          exit 1

      - name: Run the test suites
        run: make workflow-test
