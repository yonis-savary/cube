# Production stack : run it through the Makefile (`make build`, `make up`, `make deploy`), which reads
# this file only. A plain `docker compose up` also reads docker-compose.override.yml : the dev stack.
services:
  php-fpm:
    build:
      context: .
      dockerfile: Docker/Dockerfile.php
      target: prod
    volumes:
      - /var/www # Shared with nginx through its volumes_from
      - ./Storage:/var/www/Storage # Persistent Storage
      - ./.env:/var/www/.env:ro # Kept out of the image, which would carry your secrets in its layers

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes_from:
      - php-fpm # Two `- /var/www` lines would create two distinct volumes, leaving nginx's empty
    volumes:
      - ./Docker/vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
