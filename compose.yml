
services:
  php-apcu-test:
    volumes:
      - /app
    build:
      context: .
      dockerfile: tests/Dockerfile.apcu

  nginx-apcu-test:
    image: nginx:alpine
    ports:
      - "${CUBE_TEST_NGINX_APCU_PORT:-9903}:80"
    volumes:
      - /app
      - ./tests/apcu-nginx-vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-apcu-test

  mysql:
    image: mysql
    restart: always
    volumes:
      - type: tmpfs
        target: /var/lib/mysql
        tmpfs:
          size: 2147483648
    ports:
      - ${CUBE_TEST_MYSQL_PORT:-9901}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${CUBE_TEST_DATABASE_PASSWORD:-root}
    # A data-provided test keeps its connection for the whole process, whatever the number of workers
    # Without --skip-log-bin, every test database and dump is kept in the binary log on the tmpfs for 30 days
    command: ["--max-connections=500", "--skip-log-bin"]
  postgres:
    image: postgres
    restart: always
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          # Every test method provisions its own database and nothing is dropped before the
          # process ends, so the live set is the whole run : parallel workers multiply the peak
          size: 4294967296
    ports:
      - ${CUBE_TEST_POSTGRES_PORT:-9902}:5432
    environment:
      POSTGRES_PASSWORD: ${CUBE_TEST_DATABASE_PASSWORD:-root}
    # A data-provided test keeps its connection for the whole process, whatever the number of workers
    # CREATE DATABASE logs every copied page : a small WAL is recycled before it fills the tmpfs
    command: ["postgres", "-c", "max_connections=500", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB"]

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]